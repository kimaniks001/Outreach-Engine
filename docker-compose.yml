services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach_dev_only
      POSTGRES_DB: outreach_engine
    ports:
      - "5432:5432"
    volumes:
      - outreach_db_data:/var/lib/postgresql/data

volumes:
  outreach_db_data:
