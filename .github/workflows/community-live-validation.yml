name: Community LIVE validation

on:
  pull_request:
    paths:
      - "src/app/(community)/**"
      - "src/app/api/securepay-auth/**"
      - "src/components/community/**"
      - "src/lib/community/**"
      - "src/middleware.ts"
      - "tests/community-*.test.ts"
      - "tests/securepay-market-auth.test.ts"
      - ".github/workflows/community-live-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://outreach:outreach@127.0.0.1:5432/outreach_engine_ci
      SESSION_SECRET: community-live-ci-session-secret-32-bytes-minimum
      SECUREPAY_API_BASE_URL: https://securepay.invalid/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The repository currently has pre-existing package-lock drift: npm ci
      # fails before project code is reached because the Vitest/Vite esbuild
      # tree is incomplete in package-lock.json. Use npm install here so this
      # PR can still prove lint/type/test/build. The lockfile repair remains a
      # separate repository-maintenance task; this workflow does not commit the
      # runner-generated lockfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report lockfile drift
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::warning::package-lock.json is out of sync with package.json; validation used npm install to reconcile it in the runner."
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
