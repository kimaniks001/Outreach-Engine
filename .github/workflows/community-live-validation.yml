name: Outreach validation

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "src/app/(community)/**"
      - "src/app/(dashboard)/today/**"
      - "src/app/(dashboard)/conversations/**"
      - "src/app/(dashboard)/work/**"
      - "src/app/(dashboard)/traders/**"
      - "src/app/(dashboard)/growth/**"
      - "src/app/(dashboard)/operations/**"
      - "src/app/(dashboard)/people/**"
      - "src/app/(dashboard)/layout.tsx"
      - "src/app/(dashboard)/studio/**"
      - "src/app/(dashboard)/approvals/**"
      - "src/app/api/securepay-auth/**"
      - "src/app/api/campaigns/**"
      - "src/app/api/creative/**"
      - "src/app/api/claim-sources/**"
      - "src/app/api/assets/**"
      - "src/app/api/distribution/**"
      - "src/app/api/impact/**"
      - "src/app/api/market-learning/**"
      - "src/app/api/market-network/**"
      - "src/app/globals.css"
      - "src/components/nav/**"
      - "src/components/nerve/**"
      - "src/components/community/**"
      - "src/components/readiness/**"
      - "src/components/market/**"
      - "src/components/market-network/**"
      - "src/components/studio/**"
      - "src/components/approvals/**"
      - "src/components/assets/**"
      - "src/lib/conversations/**"
      - "src/lib/community/**"
      - "src/lib/readiness/**"
      - "src/lib/market/**"
      - "src/lib/market-network/**"
      - "src/lib/market-learning/**"
      - "src/lib/impact/**"
      - "src/lib/growth-director/**"
      - "src/lib/studio/**"
      - "src/lib/approvals/**"
      - "src/lib/assets/**"
      - "src/lib/ai/**"
      - "src/lib/creative/**"
      - "src/lib/campaigns/**"
      - "src/lib/brand-guardian/**"
      - "src/lib/rbac/**"
      - "src/lib/distribution/**"
      - "src/lib/audit/**"
      - "src/middleware.ts"
      - "tailwind.config.ts"
      - "tests/community-*.test.ts"
      - "tests/readiness-*.test.ts"
      - "tests/market-*.test.ts"
      - "tests/market-learning-*.test.ts"
      - "tests/approval-*.test.ts"
      - "tests/asset-*.test.ts"
      - "tests/distribution-*.test.ts"
      - "tests/phase2-staff-conversations.test.ts"
      - "tests/phase3-adapter.test.ts"
      - "tests/phase3-db.test.ts"
      - "tests/phase5-*.test.ts"
      - "tests/brand-guardian.test.ts"
      - "tests/securepay-market-auth.test.ts"
      - ".github/workflows/community-live-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach
          POSTGRES_DB: outreach_engine_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U outreach -d outreach_engine_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://outreach:outreach@127.0.0.1:5432/outreach_engine_ci
      SESSION_SECRET: market-network-ci-session-secret-32-bytes-minimum
      SECUREPAY_API_BASE_URL: https://securepay.invalid/api/v1
      SEED_OWNER_PASSWORD: market-network-ci-owner-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Report lockfile drift
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            echo "::warning::package-lock.json is out of sync with package.json; validation used npm install to reconcile it in the runner."
          fi

      - name: Migrate test database
        run: npx tsx scripts/migrate.ts

      - name: Seed deterministic test data
        run: npx tsx scripts/seed.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee vitest-output.txt

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-vitest-output
          path: vitest-output.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Production build
        run: npm run build
